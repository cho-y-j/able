[project]
name = "able-backend"
version = "0.1.0"
description = "ABLE - AI-Powered Stock Auto-Trading Platform"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    # fastapi 0.137+는 include_router가 실제 라우트 대신 `_IncludedRouter`(path 속성 없음)를
    # app.routes에 등록한다 → 라우트 introspection 비호환, 이 코드베이스에서 미검증
    "fastapi>=0.115.0,<0.137",
    # fastapi 0.136은 starlette 상한을 선언하지 않는다(0.130까지는 <1.0.0였음).
    # starlette 1.x는 미검증이므로 직접 고정한다
    "starlette>=0.46.0,<1.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.9",
    # Database
    "sqlalchemy[asyncio]>=2.0,<2.1",  # 2.1은 postgresql:// 기본 드라이버를 psycopg v3로 변경 — 미검증
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "psycopg2-binary>=2.9.0",
    # Redis
    "redis>=5.0",
    # Auth & Security
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "email-validator>=2.0",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "bcrypt>=4.0,<4.1",  # passlib 1.7.4는 bcrypt>=4.1의 __about__ 제거와 비호환
    "cryptography>=43.0",
    # HTTP client
    "httpx>=0.27.0",
    # Async tasks
    "celery[redis]>=5.4",
    # AI / LangGraph
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "langchain-anthropic>=0.3",
    "langchain-google-genai>=2.0",
    # Financial analysis
    "pandas>=2.0",
    "numpy>=1.24",
    "pandas-ta>=0.3.14b1",
    "vectorbt>=0.26",
    "optuna>=4.0",
    "yfinance>=0.2.31",
    # WebSocket
    "websockets>=13.0",
    # PDF reports
    "reportlab>=4.0",
    # Monitoring
    "prometheus-client>=0.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27.0",
    "pytest-cov>=5.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
