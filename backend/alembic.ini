[alembic]
script_location = alembic
prepend_sys_path = .
# 드라이버를 명시한다. bare `postgresql://` 는 SQLAlchemy 의 기본 드라이버 선택에 의존하는데
# 그 기본값은 버전에 따라 변한다 (2.1 은 psycopg v3 로 바꾼다).
# 실사용 값은 alembic/env.py:16 이 DATABASE_URL_SYNC 로 덮어쓰므로 이 줄은 대체값이다.
sqlalchemy.url = postgresql+psycopg2://able:able_secret@localhost:5432/able

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
