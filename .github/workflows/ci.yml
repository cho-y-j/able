name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "20"

jobs:
  # ── Backend: lint + test ──
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: able
          POSTGRES_PASSWORD: able_secret
          POSTGRES_DB: able_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://able:able_secret@localhost:5432/able_test
      DATABASE_URL_SYNC: postgresql+psycopg2://able:able_secret@localhost:5432/able_test
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-test-secret-key-not-for-production
      # ENCRYPTION_KEY는 여기 선언하지 않는다. 아래 "Generate throwaway ENCRYPTION_KEY"
      # 스텝이 $GITHUB_ENV로 주입한다. job-level env에 같은 이름이 남아 있으면
      # $GITHUB_ENV 값을 가릴 수 있으므로 선언 자체를 제거한다.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install ".[dev]"

      # 테스트 전용 일회용 Fernet 키. 매 실행마다 새로 만들고 job이 끝나면 버린다.
      # 운영 키는 저장소·워크플로에 두지 않는다. 암호화된 값을 CI 밖으로 들고 나갈 수 없다.
      - name: Generate throwaway ENCRYPTION_KEY (single-use, discarded with the runner)
        working-directory: backend
        run: |
          echo "ENCRYPTION_KEY=$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')" >> "$GITHUB_ENV"

      - name: Run tests
        working-directory: backend
        run: pytest --tb=short -q --no-header

  # ── Frontend: lint + build ──
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check & build
        working-directory: frontend
        run: npm run build

  # ── Docker: build image (no push) ──
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t able-backend:ci ./backend

      - name: Verify image
        run: docker run --rm able-backend:ci python -c "import app; print('OK')"
